# Local Postgres for development. Works with `docker compose` and `podman compose`;
# `npm run db:up` picks whichever is installed (scripts/compose.mjs).
name: maaz20x

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: maaz
      POSTGRES_PASSWORD: maaz
      POSTGRES_DB: maaz20x
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maaz -d maaz20x"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
