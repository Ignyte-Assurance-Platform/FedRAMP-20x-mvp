# Weekly dependency updates, grouped so the PR noise stays low.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # typescript-eslint 8.x accepts TypeScript < 6.1; a new major breaks npm ci.
      # Remove once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must match the Node major we run (CI and production: Node 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
