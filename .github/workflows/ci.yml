name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: maaz
          POSTGRES_PASSWORD: maaz
          POSTGRES_DB: maaz20x
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maaz -d maaz20x"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://maaz:maaz@localhost:5432/maaz20x
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability scan (fails on high or critical)
        # The npm advisory endpoint times out now and then; retry before failing.
        run: |
          for attempt in 1 2 3; do
            npm run audit:deps && exit 0
            echo "npm audit attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1
      - name: The retired staff allowlist stays gone (WI-019 2.11)
        # The brackets keep this line from matching itself.
        run: |
          if grep -rnE 'ADMIN_[E]MAILS|seed:[a]llowlist' server deploy .github Dockerfile package.json README.md; then
            echo "The allowlist was retired by WI-019: the staff Google group decides who may sign in."
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests with coverage floor
        run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14
      - run: npm run build
      - name: Migrate and seed the database
        run: npm run db:migrate && npm run db:seed
        env:
          NODE_ENV: development
      - run: npm run test:smoke

  image:
    # The deploy builds this Dockerfile only after the merge; build it on every PR so a broken
    # image fails here instead of in the deploy. Not pushed anywhere.
    name: production image builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t fedramp-20x-mvp:ci .
