name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: maaz
          POSTGRES_PASSWORD: maaz
          POSTGRES_DB: maaz20x
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maaz -d maaz20x"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://maaz:maaz@localhost:5432/maaz20x
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability scan (fails on high or critical)
        run: npm run audit:deps
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests with coverage floor
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14
      - run: npm run build
      - name: Migrate and seed the database
        run: npm run db:migrate && npm run db:seed
        env:
          NODE_ENV: development
      - run: npm run test:smoke
