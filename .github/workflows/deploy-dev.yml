name: Deploy dev

# WI-017: every push to main that passes CI is deployed to Cloud Run dev. The job deploys the
# exact commit CI tested and authenticates through Workload Identity Federation (no keys in
# GitHub). The new revision starts with no traffic under the tag `candidate`; it gets 100 % only
# after its own /api/health answers 200, so a failed deploy never reaches users.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  PROJECT_ID: ignyte-maaz20x-dev
  REGION: us-central1
  SERVICE: ignyte-fedramp-20x
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE_REPO: us-central1-docker.pkg.dev/ignyte-maaz20x-dev/maaz20x/web
  WIF_PROVIDER: projects/631427647079/locations/global/workloadIdentityPools/github/providers/fedramp-20x-mvp
  DEPLOYER: github-deployer@ignyte-maaz20x-dev.iam.gserviceaccount.com
  APP_URL: https://ignyte-fedramp-20x-631427647079.us-central1.run.app

jobs:
  deploy:
    name: build and deploy to Cloud Run dev
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Pick the commit to deploy
        id: commit
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGISTRY" --quiet
          docker build -t "$IMAGE_REPO:${{ steps.commit.outputs.short }}" .
          docker push "$IMAGE_REPO:${{ steps.commit.outputs.short }}"

      - name: Deploy the revision with no traffic
        id: deploy
        run: |
          # The revision serving now keeps 100 % until the new one passes the health check.
          serving=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json 2>/dev/null \
            | jq -r '[.status.traffic[]? | select(.percent > 0)] | max_by(.percent) | .revisionName // empty' || true)
          sed -e "s|IMAGE_PLACEHOLDER|$IMAGE_REPO:${{ steps.commit.outputs.short }}|" \
              -e "s|COMMIT_PLACEHOLDER|${{ steps.commit.outputs.short }}|" \
              -e "s|RUN_PLACEHOLDER|${{ github.run_id }}-${{ github.run_attempt }}|" \
              deploy/cloud-run/ignyte-fedramp-20x.dev.yaml > "$RUNNER_TEMP/service.yaml"
          if [ -n "$serving" ]; then
            printf '  traffic:\n    - revisionName: %s\n      percent: 100\n    - latestRevision: true\n      percent: 0\n      tag: candidate\n' \
              "$serving" >> "$RUNNER_TEMP/service.yaml"
          fi
          gcloud run services replace "$RUNNER_TEMP/service.yaml" --project "$PROJECT_ID" --region "$REGION"
          # First deploy of the service: no tag, the new revision already has the traffic.
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url // empty')
          echo "url=${url:-$APP_URL}" >> "$GITHUB_OUTPUT"

      - name: Health check of the new revision
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.url }}/api/health"

      - name: Send all traffic to the new revision
        run: gcloud run services update-traffic "$SERVICE" --to-latest --project "$PROJECT_ID" --region "$REGION"
